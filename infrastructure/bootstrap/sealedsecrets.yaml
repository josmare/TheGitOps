---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 6h0m0s
  # The project moved from the bitnami-labs org to bitnami; the old
  # bitnami-labs.github.io/sealed-secrets index.yaml now returns 404, which
  # left this HelmRepository stuck at Ready=False. Chart 2.17.7 (appVersion
  # 0.32.2, the version already running) exists at the new URL, so this is a
  # source change only -- no chart upgrade.
  url: https://bitnami.github.io/sealed-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  chart:
    spec:
      chart: sealed-secrets
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
      version: 2.17.7 # 0.32.2
  interval: 1h
  releaseName: sealed-secrets-controller
  targetNamespace: kube-system
  values:
    resources:
      requests:
        cpu: 10m
        memory: 24Mi   # measured 16Mi
      limits:
        memory: 64Mi

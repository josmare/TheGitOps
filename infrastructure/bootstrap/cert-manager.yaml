apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 6h0m0s
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: jetstack
      version: v1.18.2 # v1.18.2
  interval: 6h0m0s
  install:
    createNamespace: true
  releaseName: cert-manager
  targetNamespace: cert-manager
  values:
    installCRDs: true
    prometheus:
      enabled: false
    # All three cert-manager pods shipped with no requests or limits, so they
    # ran BestEffort and were evicted first under pressure (58 / 39 / 90
    # restarts). Values below are measured working set plus headroom.
    resources:
      requests:
        cpu: 10m
        memory: 48Mi   # measured 28Mi
      limits:
        memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi   # measured 29Mi
        limits:
          memory: 128Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi   # measured 11Mi
        limits:
          memory: 96Mi
    # config:
    #   featureGates:
    #     # Disable the use of Exact PathType in Ingress resources, to work around a bug in ingress-nginx
    #     # https://github.com/kubernetes/ingress-nginx/issues/11176
    #     ACMEHTTP01IngressPathTypeExact: false

---
# Registry pull secret for registry.gitlab.com/josmarr/lohko.
#
# Lohko is a separate GitLab project, so the josmar-ips token cannot see its
# registry path. This is sealed from a token scoped to reach it. Cluster-wide
# scope, so the same ciphertext is reused verbatim in tenants/teams/josmar/lohko.yaml
# to give the image scanner in flux-josmar the same credential.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: lohko-ips
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: lohko-ips
    type: kubernetes.io/dockerconfigjson

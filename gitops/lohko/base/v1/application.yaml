apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lohko-app
  name: lohko-app
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: lohko-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: lohko-app
    spec:
      containers:
        - name: lohko-app
          image: registry.gitlab.com/josmarr/lohko:placeholder
          imagePullPolicy: Always
          # Static nginx site serving a Vite bundle, sized off the
          # josmar personal page which has the same shape.
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          ports:
            # nginx-unprivileged listens on 8080 as a non-root user.
            - containerPort: 8080
              name: web
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      imagePullSecrets:
        - name: josmar-ips
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30

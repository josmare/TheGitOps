---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No config-secrets.yaml here: this app is deployed alongside the personal
# page in the josmar namespace and reuses the josmar-ips pull secret that
# the josmar tenant already provides.
resources:
  - application.yaml
  - networking-ingress.yaml
  - networking-svc.yaml

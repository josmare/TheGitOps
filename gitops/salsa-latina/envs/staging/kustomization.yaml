apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging-salsa-latina
resources:
  - ../../base/v1/
  - basic-auth-secret.yaml
  - database.yaml
images:
  - name: registry.gitlab.com/josmarr/salsa-latina
    newTag: main-75dde3de-15579270380 # {"$imagepolicy": "flux-salsa-latina:salsa-latina-stg-ip:tag"}
patches:
  - target:
      kind: Ingress
      name: salsa-latina-ingress
    path: patches-ingress.yaml
  - target:
      kind: Deployment
      name: salsa-latina-app
    path: patches-deployment.yaml

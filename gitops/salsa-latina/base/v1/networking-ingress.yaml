---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    no-nginx.ingress.kubernetes.io/auth-realm: realm string
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 40m
  name: salsa-latina-ingress
spec:
  rules:
    - host: PLACEHOLDER
      http:
        paths:
          # Backend paths (Django, same host — see salsalatina/urls.py).
          # Kept ahead of the frontend catch-all for readability; nginx
          # ingress sorts by path specificity regardless of list order.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: salsa-latina-backend-svc
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: salsa-latina-backend-svc
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: salsa-latina-backend-svc
                port:
                  number: 8000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: salsa-latina-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: salsa-latina-svc
                port:
                  number: 80
  tls:
    - hosts:
        - PLACEHOLDER
      secretName: salsa-latina-certificate-1

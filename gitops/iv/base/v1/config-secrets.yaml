# Registry pull secret for registry.gitlab.com/josmarr/iv.
#
# Cluster-wide scope, so this is the lohko-ips ciphertext re-labelled iv-ips and
# reused verbatim in tenants/teams/josmar/iv.yaml for the image scanner in
# flux-josmar. It only works if that token can read josmarr/iv; if the image pull
# or ImageRepository reports 401, re-seal a token scoped to this project:
#   kubeseal --scope cluster-wide ... (see the command in the repo COMANDOS file)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: iv-ips
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: iv-ips
    type: kubernetes.io/dockerconfigjson

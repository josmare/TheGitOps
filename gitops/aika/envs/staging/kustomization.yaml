apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging-aika
resources:
  - ../../base/v1/
  - aika-secrets.yaml
  - basic-auth-secret.yaml
images:
  - name: registry.gitlab.com/ezbaa/aika
    newTag: main-19a62648-2923045252 # {"$imagepolicy": "flux-aika:aika-stg-ip:tag"}
  - name: registry.gitlab.com/ezbaa/aika-frontend
    newTag: main-ed312507-2933493355 # {"$imagepolicy": "flux-aika:aika-frontend-stg-ip:tag"}
patches:
  - target:
      kind: Ingress
      name: aika-ingress
    path: patches-ingress.yaml
  - target:
      kind: Ingress
      name: aika-api-ingress
    path: patches-api-ingress.yaml
  # TEMPORARY (step 1 of 2): drop aika-api-ingress so Flux's dry-run passes and
  # it can update the live aika-ingress to the version without /api. Until then
  # ingress-nginx rejects aika-api-ingress because the live aika-ingress still
  # owns /api, which has kept this overlay from applying since 2026-10-20 (396b94e).
  # Step 2: revert this commit once aika-staging-fks shows it as applied.
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: aika-api-ingress


---
# iv (IvanBeltran) rides along in the josmar tenant, same as lohko: it reuses the
# production-josmar namespace, the josmar-team service account and its
# RoleBinding, so the only new objects are the image tracking below and one
# Kustomization. The tenant's existing ImageUpdateAutomation scans the whole repo
# for $imagepolicy markers, so it picks up the iv overlay with no extra object.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: iv-ir
  namespace: flux-josmar
spec:
  image: registry.gitlab.com/josmarr/iv
  interval: 5m0s
  secretRef:
    name: iv-ips

---
# Tracks the main-branch tags the CI release:staging job publishes, shaped
# main-<short-sha>-<job-id>. The job id is the numerical sort key.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: iv-stg-ip
  namespace: flux-josmar
spec:
  imageRepositoryRef:
    name: iv-ir
  filterTags:
    pattern: '^main-[a-fA-F0-9]+-(?P<ts>.*)'
    extract: '$ts'
  policy:
    numerical:
      order: asc

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iv-production-fks
  namespace: flux-josmar
spec:
  interval: 10m0s
  path: ./gitops/iv/envs/production
  prune: true
  serviceAccountName: josmar-team
  targetNamespace: production-josmar
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

---
# Same ciphertext as gitops/iv/base/v1/config-secrets.yaml, placed here so the
# ImageRepository above can authenticate its registry scans from flux-josmar.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: iv-ips
  namespace: flux-josmar
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: iv-ips
    type: kubernetes.io/dockerconfigjson

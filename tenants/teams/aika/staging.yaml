---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    toolkit.fluxcd.io/tenant: aika-team
  name: staging-aika
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    toolkit.fluxcd.io/tenant: aika-team
  name: aika-team
  namespace: staging-aika
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    toolkit.fluxcd.io/tenant: aika-team
  name: aika-team-reconciler
  namespace: staging-aika
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: gotk:aika-team:reconciler
  - kind: ServiceAccount
    name: aika-team
    namespace: flux-aika
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aika-staging-fks
  namespace: flux-aika
spec:
  interval: 10m0s
  path: ./gitops/aika/envs/staging
  prune: true
  serviceAccountName: aika-team
  targetNamespace: staging-aika
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

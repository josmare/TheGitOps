---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cloudnative-pg
      interval: 6h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cnpg
      version: "0.28.2"
  install:
    createNamespace: true
  interval: 6h0m0s
  targetNamespace: cnpg-system
  values:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi   # measured 34Mi
      limits:
        memory: 128Mi
